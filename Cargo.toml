[package]
name = "pominspect"
version = "0.0.1"
edition = "2024"
description = "Terminal UI for exploring a Maven build's effective POM and dependency tree, with the origin of every dependency"
repository = "https://github.com/RaccoonDev/pominspect"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.42.0"
ratatui = "0.30.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
